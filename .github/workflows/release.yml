name: Publish v1.0.0
on:
  push:
    branches: [main]
    paths: ['dist/wa-translator-extension-v1.0.0.zip']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v1.0.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package
        run: |
          cd dist
          sha256sum -c wa-translator-extension-v1.0.0.sha256
          unzip -t wa-translator-extension-v1.0.0.zip
      - name: Publish first stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'Release v1.0.0 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v1.0.0 \
            --target "$GITHUB_SHA" \
            --title 'v1.0.0 · WhatsApp 翻译助手首个正式版' \
            --notes-file CHANGELOG.md \
            --latest \
            dist/wa-translator-extension-v1.0.0.zip \
            dist/wa-translator-extension-v1.0.0.sha256
