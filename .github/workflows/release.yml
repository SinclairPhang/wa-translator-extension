name: Publish v1.0.2
on:
  push:
    branches: [main]
    paths: ['dist/wa-translator-extension-v1.0.2.zip']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v1.0.2
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify package
        run: |
          cd dist
          sha256sum -c wa-translator-extension-v1.0.2.sha256
          unzip -t wa-translator-extension-v1.0.2.zip
      - name: Publish first stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.2 >/dev/null 2>&1; then
            echo 'Release v1.0.2 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v1.0.2 \
            --target "$GITHUB_SHA" \
            --title 'v1.0.2 · WhatsApp 翻译助手联系人识别修复' \
            --notes-file RELEASE_NOTES.md \
            --latest \
            dist/wa-translator-extension-v1.0.2.zip \
            dist/wa-translator-extension-v1.0.2.sha256
